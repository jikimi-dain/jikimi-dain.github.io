<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>방하착 프로그램 모음</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-512.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>:root{color-scheme:dark}html,body{margin:0;height:100%;background:#16181d;color:#f2f2f2;font-family:-apple-system,"Malgun Gothic",sans-serif}
#lk{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.bx{width:min(440px,100%);background:#1f232b;border:2px solid #c9a227;border-radius:22px;padding:26px 22px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.bx h1{margin:0 0 6px;font-size:28px;color:#ffd76a}.bx p{margin:6px 0 16px;font-size:17px;color:#ccc}
.bx input[type=password]{width:100%;box-sizing:border-box;font-size:24px;padding:14px 16px;border-radius:14px;border:2px solid #4a5263;background:#11141a;color:#fff;text-align:center;letter-spacing:4px}
.bx label{display:flex;gap:10px;align-items:center;justify-content:center;margin:14px 0;font-size:18px}.bx label input{width:26px;height:26px}
.bx button{width:100%;font-size:24px;font-weight:800;padding:14px;border:0;border-radius:14px;background:linear-gradient(180deg,#ffe066,#f2b705);color:#2b1d00}
.er{color:#ff8787;font-size:18px;min-height:26px;margin-top:10px;font-weight:700}</style></head>
<body><div id="lk" hidden><form class="bx" id="lf" autocomplete="off"><h1>🔒 방하착 프로그램 모음</h1><p>암호를 넣어 주세요</p>
<input type="password" id="pw" inputmode="text" autocomplete="current-password" placeholder="암호"><label><input type="checkbox" id="rm" checked> 이 기기에서 기억하기</label>
<button type="submit">열기</button><div class="er" id="er"></div></form></div>

const b64=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
const u64=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
async function derive(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(P.s),iterations:P.i,hash:'SHA-256'},k,512))}
async function unlock(raw){const iv=b64(P.v),ct=b64(CT),all=new Uint8Array(16+ct.length);all.set(iv,0);all.set(ct,16);
 const mk=await crypto.subtle.importKey('raw',raw.slice(32,64),{name:'HMAC',hash:'SHA-256'},false,['verify']);if(!await crypto.subtle.verify('HMAC',mk,b64(P.m),all))return false;
 const ek=await crypto.subtle.importKey('raw',raw.slice(0,32),'AES-CBC',false,['decrypt']);const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv},ek,ct));
 document.open();document.write(html);document.close();return true}
(async()=>{let saved=null;try{saved=localStorage.getItem('jkLock')}catch(e){}
 if(saved){try{if(await unlock(b64(saved)))return}catch(e){}try{localStorage.removeItem('jkLock')}catch(e){}}
 document.getElementById('lk').hidden=false;const pw=document.getElementById('pw');setTimeout(()=>pw.focus(),200);
 document.getElementById('lf').addEventListener('submit',async ev=>{ev.preventDefault();const er=document.getElementById('er');er.textContent='여는 중…';
  const keep=document.getElementById('rm').checked;
  try{const raw=await derive(pw.value);if(await unlock(raw)){try{if(keep)localStorage.setItem('jkLock',u64(raw))}catch(e){}return}er.textContent='암호가 달라요. 다시 넣어 주세요.';pw.select()}catch(e){er.textContent='열지 못했어요 — '+(e&&e.message||e)}})})();
